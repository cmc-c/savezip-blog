title: 세이브집
description: 집에서 써먹을 만한 것만 모아둡니다. 생활템·자취템 큐레이션.
theme: minima
lang: ko
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
minima:
  skin: auto
exclude:
  - README.md

# ─────────────────────────────────────────────────────────────
# 쿠팡 파트너스
#
# tracking_code 는 이미 발급된 값이다.
# widgets 의 각 id 는 파트너스 사이트에서 배너를 만들어야 나온다
#   (링크생성 → 다이나믹 배너 → 배너 생성 → 코드의 "id" 숫자).
# id 가 비어 있으면 그 슬롯은 렌더되지 않는다 — 빈 자리가 노출되지 않게.
# ─────────────────────────────────────────────────────────────
coupang:
  tracking_code: AF6414780
  disclosure: 이 사이트는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.

  widgets:
    top_carousel:      # 글 상단 가로 캐러셀
      id:
      template: carousel
      width: "100%"
      height: "140"
    bottom_banner:     # 글 하단 관련 상품
      id:
      template: carousel
      width: "100%"
      height: "140"
    sidebar:           # 사이드바 세로형
      id:
      template: banner
      width: "300"
      height: "250"
    search:            # 검색 위젯
      id:
      template: search
      width: "100%"
      height: "60"

  # 카테고리 배너 — 파트너스에서 카테고리별 배너를 만들고 id 를 넣는다
  categories:
    - name: 패션·의류
      slug: fashion
      id:
    - name: 뷰티
      slug: beauty
      id:
    - name: 생활용품
      slug: living
      id:
    - name: 식품
      slug: food
      id:

  # 이벤트·프로모션 — 파트너스에서 발급한 링크를 넣는다. url 이 비면 표시 안 함.
  promotions:
    - name: 골드박스 오늘의 특가
      emoji: "🎁"
      url:
    - name: 로켓배송 베스트
      emoji: "🚀"
      url:
    - name: 와우 전용딜
      emoji: "💜"
      url:
